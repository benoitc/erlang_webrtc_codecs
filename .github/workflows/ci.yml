name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # A codec library that is missing fails the build, so no native test
  # is skipped without notice.
  WEBRTC_CODECS_REQUIRE: "opus;vpx;openh264;dav1d;aom"

jobs:
  linux:
    name: Linux, OTP 29
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: 'nightly'

      # The G.711, playback and capture tests use FFmpeg and skip without it.
      - name: Install FFmpeg and the codec libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake pkg-config \
            libopus-dev libvpx-dev libopenh264-dev libdav1d-dev libaom-dev

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp-29-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-29-

      - name: Compile
        run: rebar3 compile

      - name: Check formatting
        run: rebar3 fmt --check

      - name: Unit tests
        run: rebar3 eunit

      - name: Peer connection suites
        run: rebar3 ct

      - name: Lint
        run: rebar3 lint

      - name: Xref
        run: rebar3 xref

      - name: Dialyzer
        run: rebar3 dialyzer

      - name: Docs
        run: rebar3 ex_doc

  macos:
    name: macOS
    needs: linux
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # brew ships the current OTP; the point of this job is the
      # platform, which the Linux job does not cover.
      - name: Set up Erlang, FFmpeg and the codec libraries
        run: brew install erlang rebar3 cmake pkg-config ffmpeg opus libvpx openh264 dav1d aom

      - name: Compile
        run: rebar3 compile

      - name: Unit tests
        run: rebar3 eunit

      - name: Peer connection suites
        run: rebar3 ct

  freebsd:
    name: FreeBSD
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          envs: WEBRTC_CODECS_REQUIRE
          # The versioned Erlang package installs outside the default
          # PATH, and the rebar3 package brings another Erlang with it.
          prepare: |
            pkg install -y git erlang-runtime29 cmake-core pkgconf opus libvpx openh264 dav1d aom ffmpeg
          run: |
            export PATH="/usr/local/lib/erlang29/bin:/usr/local/bin:$PATH"
            erl -noshell -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().'
            fetch -q https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3 -o rebar3
            chmod +x rebar3
            ./rebar3 compile
            ./rebar3 eunit
            ./rebar3 ct

  # musl, in the image the script builds.
  alpine:
    name: Alpine
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: 'nightly'

      # The script gives the container the dependencies fetched here.
      - name: Fetch dependencies
        run: rebar3 get-deps

      - name: Test on Alpine
        run: WEBRTC_CODECS_LINUX=alpine scripts/test-linux.sh

  # The NIFs built with ASan, UBSan and fault injection.
  sanitizers:
    name: Sanitizers
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: 'nightly'

      - name: Fetch dependencies
        run: rebar3 get-deps

      - name: Test with sanitizers
        run: scripts/test-sanitizers.sh
